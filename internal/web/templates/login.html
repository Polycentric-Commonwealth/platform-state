{{define "content"}}
<h1>Officials' sign-in</h1>
<p class="lead">Officials run the dividend cycle and keep the residents' register. Each official has their own account; an admin can create one for you.</p>
<form class="stack" method="post" action="/officials/login">
  <input type="hidden" name="next" value="{{.Next}}">
  <label>Username
    <input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" value="{{.Username}}"{{if not .Username}} autofocus{{end}}></label>
  <label>Password
    <input name="password" type="password" required autocomplete="current-password"{{if .Username}} autofocus{{end}}></label>
  <div><button class="primary" type="submit">Sign in</button></div>
</form>
{{end}}
